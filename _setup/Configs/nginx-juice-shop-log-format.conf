# /etc/nginx/conf.d/juice-shop-log-format.conf
#
# Custom JSON log format for SIEM ingestion.
# JSON output enables auto-extraction in Splunk and Elastic with no parser config.
# `escape=json` ensures special characters in user input don't break the JSON.

log_format juiceshop_json escape=json '{'
    '"timestamp":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"remote_port":"$remote_port",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"path":"$uri",'
    '"query":"$args",'
    '"status":$status,'
    '"bytes_sent":$bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent",'
    '"referer":"$http_referer",'
    '"authorization":"$http_authorization",'
    '"cookie":"$http_cookie",'
    '"x_forwarded_for":"$http_x_forwarded_for"'
'}';

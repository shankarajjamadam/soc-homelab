# /etc/nginx/sites-available/juice-shop
#
# Reverse-proxy config: nginx listens on :80 and proxies to Juice Shop on loopback :3000.
# All HTTP requests are logged in JSON format for SIEM ingestion before being passed
# to the backend. WebSocket upgrade is preserved for Juice Shop's chatbot feature.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    access_log /var/log/nginx/juice-shop-access.log juiceshop_json;
    error_log /var/log/nginx/juice-shop-error.log warn;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support (Juice Shop chatbot)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Forward original client info to the backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
    }
}
